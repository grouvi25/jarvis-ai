# J.A.R.V.I.S. — встроенный дефолтный конфиг.
# Не редактируй этот файл — он перезаписывается при обновлении.
# Свои настройки храни в ~/.config/jarvis/config.yaml (или эквиваленте OS).

general:
  language: "ru"
  wake_words: ["джарвис", "jarvis"]
  name: "Джарвис"
  master_name: "сэр"
  voice_enabled: true
  autostart: false

# LLM — мозг Джарвиса
# Провайдеры: omniroute / openai / groq / ollama / custom
llm:
  provider: "omniroute"
  model: "gpt-4o-mini"
  base_url: "http://localhost:20128/v1"
  api_key: ""
  temperature: 0.7
  max_tokens: 2048
  system_prompt: |
    Ты — J.A.R.V.I.S., AI-ассистент пользователя. Отвечай на русском.
    Обращайся к пользователю на «сэр» или по имени, если знаешь его.
    Будь вежливым, остроумным и лаконичным.
    Когда тебя просят что-то сделать на компьютере — используй инструменты:
    запусти программу, прочитай файл, проверь систему, не ограничивайся объяснениями.
    Если пользователь говорит «запомни», «я хочу чтобы ты знал», «меня зовут»,
    «не делай больше», «всегда отвечай так-то» — используй скилл notes/remember,
    чтобы сохранить факт между сессиями.

# Голосовой ввод
stt:
  engine: "google"          # google (бесплатно, нужен инет) / faster-whisper (локально)
  model: "base"             # tiny / base / small / medium / large-v3
  language: "ru"
  device: "cpu"

# Голосовой вывод
tts:
  engine: "edge-tts"        # edge-tts / xtts
  edge_voice: "ru-RU-DmitryNeural"
  edge_rate: "+10%"
  xtts_model: "tts_models/multilingual/multi-dataset/xtts_v2"
  xtts_speaker_wav: "models/jarvis_voice.wav"
  xtts_language: "ru"

telegram:
  enabled: false
  bot_token: ""
  allowed_users: []

browser:
  enabled: true
  headless: false
  browser_type: "chromium"

desktop:
  enabled: true
  screenshot_interval: 10

internet:
  enabled: false             # выключено по умолчанию, чтобы не пинговать
  check_interval: 300
  ping_host: "8.8.8.8"
  wifi_ssid: ""
  wifi_password: ""
  captive_portal:
    enabled: false
    url: ""
    username: ""
    password: ""
    method: "POST"

# Локальный HTTP-сервер с web-UI
server:
  host: "127.0.0.1"
  port: 8765
  open_browser_on_start: false
