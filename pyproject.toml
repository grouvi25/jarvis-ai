[project]
name = "jarvis-ai"
version = "0.2.0"
description = "J.A.R.V.I.S. — автономный AI-ассистент с голосовым управлением, контролем десктопа и русским языком"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "grouvi25" }]

dependencies = [
    "openai>=1.0.0",
    "edge-tts>=6.1.0",
    "SpeechRecognition>=3.10.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9.0",
    "pydub>=0.25.1",
    "rich>=13.0.0",
]

[project.optional-dependencies]
voice = [
    "sounddevice>=0.4.6",
    "openwakeword>=0.6.0",
    "faster-whisper>=1.0.0",
]
xtts = [
    "TTS>=0.22.0",
]
telegram = [
    "python-telegram-bot>=21.0",
]
browser = [
    "playwright>=1.40.0",
]
desktop = [
    "pyautogui>=0.9.54",
]
all = [
    "jarvis-ai[voice,telegram,browser,desktop]",
]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
jarvis = "jarvis.main:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
